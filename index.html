function renderPack(){const g=DATA.gear.filter(x=>state.gear[x.id]).length,c=DATA.checklist.filter(x=>state.checks[x.id]).length;let cat='';return `<div class="page-head"><div><div class="eyebrow">PACK LIGHT · PLAN WISE</div><h1>把安心装进背包。</h1><p>出发确认、极简装备与数据备份。勾选保存在本机，不需要账号。</p></div><button class="btn mini" data-action="report-section" data-section="17">原文车辆与装备 ↗</button></div><div class="pack-layout"><div class="flow"><div class="card"><div class="card-head"><h3>极简装备清单</h3><span class="tag">原报告 13 项</span></div><div class="pack-summary"><b data-gear-progress>${g}/${DATA.gear.length}</b><span>已整理</span><div class="progress-track"><div class="progress-fill" data-gear-bar style="width:${g/DATA.gear.length*100}%"></div></div></div><div class="pack-list">${DATA.gear.map(x=>`<label class="pack-row ${state.gear[x.id]?'checked':''}"><input type="checkbox" data-gear-key="${x.id}" ${state.gear[x.id]?'checked':''}><div><b>${escapeHtml(x.name)}</b><p>${escapeHtml(x.reason)}</p></div><span class="tag ${x.level==='必须'?'gold':''}">${escapeHtml(x.level)}</span></label>`).join('')}</div></div><div class="card card-pad"><h3 style="font-size:16px;margin-bottom:13px">我的手账存档</h3><p class="small muted" style="margin-bottom:15px">更换手机或清理浏览器前，请导出。导入只恢复勾选、收藏、备注与偏好，不会改写原报告。</p><div class="tool-grid"><button class="btn" data-action="export-state">${icon('save')}导出记录</button><button class="btn" data-action="import-state">${icon('upload')}导入记录</button><button class="btn" data-action="download-original">${icon('book')}下载完整原文</button><button class="btn" data-action="integrity">${icon('shield')}核验内容完整性</button></div><label class="mini-task"><input type="checkbox" id="reduce-motion" ${state.reduceMotion?'checked':''}><span>减少动态效果</span></label><div class="save-label" data-storage-label>本机自动保存</div></div>${flightTicket()}</div><div class="card"><div class="card-head"><h3>出发前确认</h3><span class="tag green">工具新增 · 不改原文</span></div><div class="pack-summary"><b data-check-progress>${c}/${DATA.checklist. function renderReport(){return `<div class="page-head"><div><div class="eyebrow">THE COMPLETE FIELD GUIDE</div><h1>每一个细节，都在这里。</h1><p>原报告 19 章完整保留。正文不改写，引用可追溯；浏览视图不是原文的替代品。</p></div><div class="report-tools"><button class="btn mini" data-action="report-all">${reportAll?'章节阅读':'全部展开'}</button><button class="btn mini" data-action="download-original">下载原文</button><button class="btn mini" data-action="sources">55 个来源</button><button class="btn mini" data-action="print-report">打印全文</button></div></div><div class="source-banner"><strong>研究快照：2026-09-16</strong>　原报告天气预报、秋色判断、航班匹配、价格和运营信息不自动更新。显示“已确认”等级的是当时研究判断，并不代表今天仍然有效。<button class="inline-link" data-action="integrity">查看完整性校验</button></div><div class="report-layout"><aside class="card report-toc"><div class="toc-heading">19 个章节 · 完整阅读</div><div class="toc-list">${REPORT.sections.map(s=>`<button class="toc-btn ${s.id===reportSection?'active':''}" data-action="toc-section" data-section="${s.id}"><span class="num">${String(s.id).padStart(2,'0')}</span><span>${escapeHtml(tocLabel(s))}</span></button>`).join('')}</div></aside><article class="report-reader"><div class="report-reader-title"><div class="eyebrow">ORIGINAL RESEARCH · PRESERVED</div><h2>${escapeHtml(REPORT.title)}</h2><div class="flex" style="flex-wrap:wrap"><span class="tag green">正文 ${REPORT.chars.toLocaleString()} 字符</span><span class="tag">10 天日程</span><span class="tag">原始引用完整保留</span></div></div><div class="prose" id="report-prose">${reportAll?REPORT.introHtml+REPORT.sections.map(s=>`<section id="report-sec-${s.id}" class="report-block">${s.html}</section>`).join(''):`<section id="report-sec-${reportSection}" class="report-block">${REPORT.sections[reportSection-1].html}</section>`}</div>${reportAll?'':`<div class="report-nav-footer"><button class="btn mini" data-action="report-section" data-section="${Math.max(1,reportSection-1)}" ${reportSection===1?'disabled':''}>← 上一章</button><span class="small muted">${reportSection} / 19</span><button class="btn mini pr function dayPlanB(id){const d=DATA.days[id-1];showModal(d.shortDate+' · 当天 Plan B',`<p><strong>原计划：</strong>${escapeHtml(d.planB.plan)}</p><p><strong>触发条件：</strong>${escapeHtml(d.planB.trigger)}</p><div class="notice">${escapeHtml(d.planB.replacement)}</div><p>这是原报告的备选建议，不是已经核实的替代道路。若有冰雪、封闭或限制，先核对实际可通行条件。</p><button class="btn mini" data-action="report-section" data-section="18">阅读完整 Plan B →</button>`)}
function updateChecksUI(){const g=DATA.gear.filter(x=>state.gear[x.id]).length,c=DATA.checklist.filter(x=>state.checks[x.id]).length;document.querySelectorAll('[data-gear-progress]').forEach(e=>e.textContent=`${g}/${DATA.gear.length}`);document.querySelectorAll('[data-check-progress]').forEach(e=>e.textContent=`${c}/${DATA.checklist.length}`);document.querySelectorAll('[data-gear-bar]').forEach(e=>e.style.width=g/DATA.gear.length*100+'%');document.querySelectorAll('[data-check-bar]').forEach(e=>e.style.width=c/DATA.checklist.length*100+'%')}
document.addEventListener('click',e=>{const cite=e.target.closest('[data-cite]');if(cite){showCitation(Number(cite.dataset.cite));return}const suggest=e.target.closest('[data-search-suggestion]');if(suggest){const i=document.getElementById('global-search');i.value=suggest.dataset.searchSuggestion;searchReport(i.value);i.focus();return}const nav=e.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='more'){showMore();return}if(document.getElementById('modal').open)closeModal();navigate(nav.dataset.nav);return}const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id,day=Number(b.dataset.day);if(a==='expand-events'){const ds=[...document.querySelectorAll('.timeline-body')],expand=ds.some(d=>!d.open);ds.forEach(d=>d.open=expand);b.textContent=expand?'收起全部':'展开全部'}else if(a==='open-day'){dayTab='timeline';navigate('days',day)}else if(a==='select-day'){navigate('days',day)}else if(a==='home-day'){state.day=day;save();render()}else if(a==='day-tab'){dayTab=b.dataset.tab;document.querySelectorAll('[data-action="day-tab"]').forEach(t=>{t.classList.toggle('active',t.dataset.tab===dayTab);t.setAttribute('aria-selected',t.dataset.tab===dayTab)});document.getElementById('day-tab-panel').innerHTML=dayPanel(DATA.days[state.day-1])}else if(a==='toggle-event'){state.completed[id]=!state.completed[id];save();const it=document.querySelector(`[data-event="${id}"]`);if(it){it.classList.toggle('done',state.completed[id]);b.textContent=state.completed[id]?'✓':'';b.setAttribute('aria-checked',!!state.completed[id])}}else if(a==='favorite'){state.favorites[id]=!state.favorites[id];save();if(foodFav)document.getElementById('food-grid').innerHTML=foodCards();else{b.classList.toggle('on',state.favorites[id]);b.setAttribute('aria-pressed',!!state.favorites[id]);const f=DATA.foods.find(f=>f.id===id);b.setAttribute('aria-label',(state.favorites[id]?'取消收藏 ':'收藏 ')+f.name)}updateFoodCount();toast(state.favorites[id]?'已收进美食图鉴收藏':'已取消收藏')}else if(a==='food-city'){foodCity=b.dataset.city;render()}else if(a==='food-favs'){foodFav=!foodFav;render()}else if(a==='day-food'){foodCity=day<=4?'呼和浩特':day===5?'额尔古纳':day>=9?'满洲里':day===8?'室韦':'全部';foodQuery='';foodFav=false;navigate('food')}else if(a==='day-map'){mapScope='day';navigate('map',day)}else if(a==='map-scope'){mapScope=b.dataset.scope;render()}else if(a==='map-day'){state.day=day;if(mapScope==='north'&&day<5)mapScope=day===4?'all':'south';else if(mapScope==='south'&&day>3)mapScope=day===4?'all':'north';save();render()}else if(a==='report-section'||a==='toc-section'||a==='report-day'||a==='report-source'||a==='search-open'){const s=a==='report-day'?day+4:a==='report-source'?1:Number(b.dataset.section);if(document.getElementById('modal').open)closeModal();if(a==='toc-section'&&reportAll){reportSection=s;document.getElementById('report-sec-'+s)?.scrollIntoView({behavior:state.reduceMotion?'instant':'smooth'});document.querySelectorAll('.toc-btn').forEach(x=>x.classList.toggle('active',Number(x.dataset.section)===s))}else navigate('report',null,{section:s})}else if(a==='report-all'){reportAll=!reportAll;render()}else if(a==='download-original'){blobDownload('2026金秋内蒙古-完整原报告.md',REPORT.markdown);toast('已导出未改写的原始 Markdown')}else if(a==='sources')showSources();else if(a==='integrity')showIntegrity();else if(a==='help')showHelp();else if(a==='more')showMore();else if(a==='close-modal')closeModal();else if(a==='export-state')exportState();else if(a==='import-state')document.getElementById('import-file').click();else if(a==='day-planb')dayPlanB(day);else if(a==='print-report'){reportAll=true;state.view='report';render();setTimeout(()=>window.print(),150)}else if(a==='search')openSearch();});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.checkKey){state.checks[el.dataset.checkKey]=el.checked;el.closest('.pack-row')?.classList.toggle('checked',el.checked);save();updateChecksUI()}if(el.dataset.gearKey){state.gear[el.dataset.gearKey]=el.checked;el.closest('.pack-row')?.classList.toggle('checked',el.checked);save();updateChecksUI()}if(el.dataset.innCheck){state.innChecks[el.dataset.innCheck]=el.checked;save()}if(el.dataset.booking!==undefined){state.bookings[el.dataset.booking]=el.value;save();toast('已记录个人住宿状态；不会向酒店提交预订')}if(el.id==='reduce-motion'){state.reduceMotion=el.checked;save();applyPreferences();if(state.reduceMotion)maps.forEach(m=>m.stop())}});
document.getElementById('theme-toggle').onclick=()=>{state.evening=!state.evening;save();applyPreferences();toast(state.evening?'夜间阅读已开启':'已回到日间手账')};
document.getElementById('import-file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>2e6){toast('存档超过2MB，请选择本页导出的个人记录文件');return}try{const obj=JSON.parse(await f.text());if(obj.app!=='autumn-quest'||obj.schema!==1||!obj.state)throw new Error('schema');showModal('导入这份旅行存档？',`<p>将恢复导出时的收藏、笔记、勾选和偏好，替换当前设备这些个人记录。原报告不受影响。</p><p class="muted">文件：${escapeHtml(f.name)}<br>导出时间：${escapeHtml(obj.exportedAt||'未记录')}</p><div class="flex"><button class="btn mini primary" id="confirm-import">确认导入</button><button class="btn mini" data-action="close-modal">取消</button></div>`);document.getElementById('confirm-import').onclick=()=>{state={...defaults,...sanitizeState(obj.state)};save();closeModal();render();toast('存档已恢复；原报告内容保持不变')}}catch(err){toast('不是有效的北境秋日手账存档，当前数据未变')}};
document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.target.isContentEditable)return;if(e.key==='/'&&!document.getElementById('modal').open){e.preventDefault();openSearch()}if(state.view==='days'&&!document.getElementById('modal').open&&!e.target.closest('.map-stage')){if(e.key==='ArrowLeft'&&state.day>1){e.preventDefault();navigate('days',state.day-1)}if(e.key==='ArrowRight'&&state.day<10){e.preventDefault();navigate('days',state.day+1)}}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('online',()=>{document.body.classList.remove('offline');toast('网络已恢复，可在地图中切换在线底图')});window.addEventListener('offline',()=>{document.body.classList.add('offline');maps.forEach(m=>{m.online=false;m.draw()});toast('已离线：正文、记录和地理概览仍可用')});
try{const hash=location.hash.slice(1).split('?'),qs=new URLSearchParams(hash[1]||'');if(viewNames[hash[0]])state.view=hash[0];const d=Number(qs.get('day'));if(d>=1&&d<=10)state.day=d;const s=Number(qs.get('section'));if(s>=1&&s<=19)reportSection=s}catch(e){}
render();
// Available to automated smoke tests and transparent manual integrity checks.
window.AutumnQuest={getState:()=>JSON.parse(JSON.stringify(state)),getData:()=>DATA,getReport:()=>REPORT,getMaps:()=>maps,navigate,render,getStorageAvailable:()=>storageAvailable};

</script></body></html>
